<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Propósito Jeans — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,520;9..144,620&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --coffee-900:#4A3524;
    --coffee-800:#5C4430;
    --coffee-700:#7C5C3E;
    --coffee-500:#AD8F6B;
    --coffee-300:#DCC7A4;
    --latte-100:#F0E2C4;
    --cream:#F6ECD9;
    --paper:#FCF8EF;
    --caramel:#B08A52;
    --caramel-dark:#8F6D3A;
    --ink:#332415;
    --stone:#8F7C64;
    --stone-light:#DFCBA9;
    --danger:#A3402E;
    --whatsapp:#3E8E5C;
    --radius-s:3px;
    --radius-m:6px;
    --radius-l:14px;
    --shadow-1: 0 1px 2px rgba(43,30,20,.06), 0 6px 20px rgba(43,30,20,.07);
    --shadow-2: 0 10px 40px rgba(43,30,20,.18);
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  img{max-width:100%; display:block;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; font-size:16px;}
  a{color:inherit;}
  ::selection{background:var(--caramel); color:#fff;}
 
  .serif{font-family:'Fraunces',serif;}
 
  /* ---------- layout shell ---------- */
  #root{min-height:100vh; display:flex; flex-direction:column;}
  .shell{width:100%; max-width:1180px; margin:0 auto; padding:0 20px;}
 
  /* ---------- header ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(237,235,227,.88);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(43,30,20,.08);
  }
  .topbar-inner{
    display:flex; align-items:center; justify-content:space-between;
    height:64px; gap:14px;
  }
  .wordmark{
    font-family:'Fraunces',serif; font-size:21px; font-weight:520;
    letter-spacing:.01em; color:var(--coffee-900); white-space:nowrap;
  }
  .topbar-actions{display:flex; align-items:center; gap:6px;}
  .icon-btn{
    width:40px; height:40px; border-radius:50%; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; color:var(--coffee-900);
    transition:background .15s var(--ease);
  }
  .icon-btn:hover{background:rgba(43,30,20,.06);}
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible{
    outline:2px solid var(--caramel); outline-offset:2px;
  }
  .icon-btn svg{width:20px; height:20px;}
  .cart-icon-btn{position:relative;}
  .cart-badge{
    position:absolute; top:2px; right:2px; min-width:16px; height:16px; padding:0 3px;
    background:var(--caramel); color:#fff; font-size:10px; font-weight:700; line-height:16px;
    border-radius:99px; text-align:center;
  }
 
  .search-row{
    overflow:hidden; max-height:0; transition:max-height .28s var(--ease);
  }
  .search-row.open{max-height:70px;}
  .search-box{
    display:flex; align-items:center; gap:8px;
    background:#fff; border:1px solid rgba(43,30,20,.14); border-radius:var(--radius-m);
    padding:10px 12px; margin-bottom:12px;
  }
  .search-box svg{width:18px; height:18px; color:var(--stone); flex:none;}
  .search-box input{border:none; outline:none; width:100%; background:transparent; font-size:15px; color:var(--ink);}
  .search-box input::placeholder{color:var(--stone-light);}
 
  /* ---------- hero ---------- */
  .hero{
    position:relative; padding:52px 20px 34px; text-align:center; overflow:hidden;
    background:
      repeating-linear-gradient(115deg, rgba(43,30,20,.05) 0px, rgba(43,30,20,.05) 1px, transparent 1px, transparent 9px),
      linear-gradient(180deg, var(--latte-100), var(--cream) 78%);
  }
  .hero-eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; color:var(--caramel-dark); font-weight:600;
    letter-spacing:.03em; margin-bottom:14px;
  }
  .hero-eyebrow .dash{width:16px; height:1px; background:var(--caramel-dark); display:inline-block;}
  .hero h1{
    font-family:'Fraunces',serif; font-weight:520; font-size:38px; line-height:1.08;
    color:var(--coffee-900); max-width:16ch; margin:0 auto 12px;
  }
  .hero p{
    font-size:16px; color:var(--coffee-700); max-width:32ch; margin:0 auto;
  }
 
  /* ---------- category chips ---------- */
  .chip-scroller{
    display:flex; gap:8px; overflow-x:auto; padding:18px 20px 4px;
    scrollbar-width:none;
  }
  .chip-scroller::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; border:1px solid rgba(43,30,20,.16); background:#fff; color:var(--coffee-900);
    padding:9px 16px; border-radius:999px; font-size:13.5px; font-weight:500;
    transition:.15s var(--ease); white-space:nowrap;
  }
  .chip.active{background:var(--coffee-900); border-color:var(--coffee-900); color:#fff;}
  .chip:hover:not(.active){border-color:var(--coffee-700);}
 
  /* ---------- toolbar (filter/sort row) ---------- */
  .toolbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 20px 4px;
  }
  .result-count{font-size:13px; color:var(--stone);}
  .filter-btn{
    display:flex; align-items:center; gap:7px; background:#fff; border:1px solid rgba(43,30,20,.16);
    border-radius:999px; padding:8px 14px; font-size:13.5px; font-weight:500; color:var(--coffee-900);
  }
  .filter-btn svg{width:15px; height:15px;}
  .filter-badge{
    background:var(--caramel); color:#fff; font-size:11px; font-weight:700;
    border-radius:999px; min-width:16px; height:16px; display:inline-flex; align-items:center; justify-content:center; padding:0 4px;
  }
 
  /* ---------- grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:16px;
    padding:16px 20px 90px;
  }
  @media(min-width:640px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media(min-width:960px){ .grid{grid-template-columns:repeat(4,1fr); gap:20px;} }
 
  .card{
    background:var(--paper); border-radius:var(--radius-l); overflow:hidden;
    border:1px solid rgba(43,30,20,.07);
    display:flex; flex-direction:column; text-align:left; width:100%;
    transition:box-shadow .18s var(--ease), transform .18s var(--ease);
  }
  .card:hover{box-shadow:var(--shadow-1); transform:translateY(-2px);}
  .card-media{
    position:relative; aspect-ratio:3/4; background:var(--latte-100); overflow:hidden;
  }
  .card-media img{width:100%; height:100%; object-fit:cover;}
  .card-tag{
    position:absolute; top:9px; left:9px; background:rgba(43,30,20,.82); color:#fff;
    font-size:10.5px; font-weight:600; letter-spacing:.02em; padding:4px 8px; border-radius:var(--radius-s);
  }
  .card-tag.copper{background:var(--caramel);}
  .card-body{padding:12px 13px 14px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card-name{font-family:'Fraunces',serif; font-size:15.5px; font-weight:520; color:var(--coffee-900); line-height:1.25;}
  .card-ref{font-size:12px; color:var(--stone); letter-spacing:.01em;}
  .card-sizes{font-size:11.5px; color:var(--coffee-700); letter-spacing:.01em;}
  .card-foot{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:6px;}
  .card-price{font-size:14.5px; font-weight:700; color:var(--coffee-900);}
  .card-price.empty{font-size:12px; font-weight:500; color:var(--stone);}
  .card-link{font-size:12.5px; font-weight:600; color:var(--caramel-dark);}
 
  /* ---------- skeleton ---------- */
  .sk-card{background:var(--paper); border-radius:var(--radius-l); overflow:hidden; border:1px solid rgba(43,30,20,.06);}
  .sk-media{aspect-ratio:3/4; background:linear-gradient(90deg,#E6E3D9 25%,#EFEDE4 37%,#E6E3D9 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite;}
  .sk-line{height:10px; border-radius:4px; margin:12px 13px; background:linear-gradient(90deg,#E6E3D9 25%,#EFEDE4 37%,#E6E3D9 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite;}
  .sk-line.w60{width:60%;}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}
 
  /* ---------- empty state ---------- */
  .empty-state{
    grid-column:1/-1; text-align:center; padding:56px 20px; color:var(--stone);
  }
  .empty-state svg{width:44px; height:44px; color:var(--coffee-300); margin-bottom:14px;}
  .empty-state h3{font-family:'Fraunces',serif; font-size:19px; color:var(--coffee-900); margin-bottom:6px; font-weight:520;}
  .empty-state p{font-size:14px; max-width:34ch; margin:0 auto;}
 
  /* ---------- footer ---------- */
  .site-footer{
    margin-top:auto; border-top:1px solid rgba(43,30,20,.09); padding:26px 20px 32px;
    display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
  }
  .site-footer .fmark{font-family:'Fraunces',serif; font-size:16px; color:var(--coffee-900); font-weight:520;}
  .footer-admin{
    font-size:12.5px; color:var(--stone); display:inline-flex; align-items:center; gap:5px;
    padding:6px 4px; border:none; background:none;
  }
  .footer-admin svg{width:13px; height:13px;}
  .footer-admin:hover{color:var(--coffee-700);}
 
  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius:var(--radius-m); font-weight:600; font-size:14.5px; border:1px solid transparent;
    padding:13px 20px; transition:.15s var(--ease); width:100%;
  }
  .btn-primary{background:var(--coffee-900); color:#fff;}
  .btn-primary:hover{background:var(--coffee-800);}
  .btn-copper{background:var(--caramel); color:#fff;}
  .btn-copper:hover{background:var(--caramel-dark);}
  .btn-ghost{background:transparent; color:var(--coffee-900); border-color:rgba(43,30,20,.18);}
  .btn-ghost:hover{background:rgba(43,30,20,.05);}
  .btn-danger{background:#fff; color:var(--danger); border-color:rgba(163,64,46,.35);}
  .btn-danger:hover{background:rgba(163,64,46,.06);}
  .btn-sm{padding:9px 14px; font-size:13px; width:auto;}
  .btn[disabled]{opacity:.5; pointer-events:none;}
  .btn svg{width:18px; height:18px; flex:none;}
 
  /* ---------- full screen views ---------- */
  .view{animation:fadein .22s var(--ease);}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .view-header{
    position:sticky; top:0; z-index:30; background:rgba(237,235,227,.92); backdrop-filter:blur(10px);
    display:flex; align-items:center; gap:10px; height:60px; border-bottom:1px solid rgba(43,30,20,.08);
    padding:0 20px;
  }
  .view-header .vtitle{font-family:'Fraunces',serif; font-size:16.5px; font-weight:520; color:var(--coffee-900);}
  .back-btn{
    display:flex; align-items:center; justify-content:center; width:36px; height:36px;
    border-radius:50%; border:none; background:transparent; color:var(--coffee-900); flex:none;
  }
  .back-btn:hover{background:rgba(43,30,20,.06);}
  .back-btn svg{width:19px; height:19px;}
 
  /* ---------- product detail ---------- */
  .pd-media{aspect-ratio:4/5; background:var(--latte-100); max-height:520px;}
  .pd-media img{width:100%; height:100%; object-fit:cover;}
  .pd-body{padding:22px 20px 120px; max-width:640px; margin:0 auto;}
  .pd-ref{font-size:12px; color:var(--stone); letter-spacing:.03em; margin-bottom:6px;}
  .pd-name{font-family:'Fraunces',serif; font-size:26px; font-weight:520; color:var(--coffee-900); margin-bottom:10px; line-height:1.15;}
  .pd-price{font-size:20px; font-weight:700; color:var(--coffee-900); margin-bottom:18px;}
  .pd-meta{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .meta-pill{font-size:12.5px; background:var(--latte-100); color:var(--coffee-800); padding:6px 12px; border-radius:999px; font-weight:500;}
  .pd-section-label{font-size:12.5px; font-weight:600; color:var(--coffee-700); letter-spacing:.02em; margin-bottom:8px;}
  .pd-desc{font-size:15px; color:#3A3A38; line-height:1.65; margin-bottom:24px;}
  .size-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px;}
  .size-pill{
    min-width:44px; height:44px; padding:0 6px; border-radius:var(--radius-m); border:1.5px solid var(--coffee-300);
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; color:var(--coffee-900);
    background:#fff; transition:.15s var(--ease);
  }
  .size-pill:hover{border-color:var(--coffee-700);}
  .size-pill.selected{background:var(--coffee-900); border-color:var(--coffee-900); color:#fff;}
  .pd-whatsapp-link{
    display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:500;
    color:var(--coffee-700); text-decoration:underline; text-underline-offset:2px; margin-top:4px;
  }
  .pd-whatsapp-link svg{width:15px; height:15px; flex:none;}
  .pd-actions{display:flex; gap:10px; margin-top:8px;}
  .pd-fixed-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:35;
    background:rgba(248,247,243,.95); backdrop-filter:blur(10px);
    border-top:1px solid rgba(43,30,20,.09); padding:12px 20px calc(12px + env(safe-area-inset-bottom));
  }
  .pd-fixed-bar .shell{max-width:640px; display:flex; gap:10px; padding:0;}
 
  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:18px; bottom:18px; z-index:36;
    width:54px; height:54px; border-radius:50%; background:var(--whatsapp); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-2);
  }
  .fab svg{width:26px; height:26px;}
  .fab:hover{filter:brightness(1.06);}
 
  /* ---------- overlay / bottom sheet ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(43,30,20,.42); z-index:50;
    opacity:0; pointer-events:none; transition:opacity .2s var(--ease);
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--paper);
    border-radius:18px 18px 0 0; max-height:86vh; overflow-y:auto;
    transform:translateY(100%); transition:transform .28s var(--ease);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--stone-light); border-radius:99px; margin:12px auto 4px;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:10px 20px 6px;}
  .sheet-head h3{font-family:'Fraunces',serif; font-size:18px; font-weight:520; color:var(--coffee-900);}
  .sheet-body{padding:6px 20px 20px;}
  .sheet-foot{
    position:sticky; bottom:0; background:var(--paper); border-top:1px solid rgba(43,30,20,.08);
    padding:14px 20px calc(14px + env(safe-area-inset-bottom)); display:flex; gap:10px;
  }
 
  .filter-group{margin-bottom:20px;}
  .filter-group h4{font-size:12.5px; font-weight:600; color:var(--coffee-700); letter-spacing:.02em; margin-bottom:10px;}
  .filter-options{display:flex; flex-wrap:wrap; gap:8px;}
  .opt-chip{
    border:1.5px solid rgba(43,30,20,.16); background:#fff; padding:8px 14px; border-radius:999px;
    font-size:13px; font-weight:500; color:var(--coffee-900);
  }
  .opt-chip.on{background:var(--coffee-900); border-color:var(--coffee-900); color:#fff;}
 
  /* ---------- centered modal (login / confirm) ---------- */
  .modal-center{
    position:fixed; inset:0; z-index:52; display:flex; align-items:center; justify-content:center; padding:20px;
    background:rgba(43,30,20,.42);
    opacity:0; pointer-events:none; transition:opacity .2s var(--ease);
  }
  .modal-center.open{opacity:1; pointer-events:auto;}
  .modal-card{
    background:var(--paper); border-radius:var(--radius-l); width:100%; max-width:380px;
    padding:26px 24px; box-shadow:var(--shadow-2);
    transform:scale(.96); transition:transform .2s var(--ease);
  }
  .modal-center.open .modal-card{transform:scale(1);}
  .modal-card h3{font-family:'Fraunces',serif; font-size:20px; font-weight:520; color:var(--coffee-900); margin-bottom:6px;}
  .modal-card p.sub{font-size:13.5px; color:var(--stone); margin-bottom:20px;}
 
  /* ---------- form elements ---------- */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--coffee-700); margin-bottom:6px; letter-spacing:.01em;}
  .field input[type=text], .field input[type=password], .field input[type=number], .field input[type=url], .field textarea, .field select{
    width:100%; border:1.5px solid rgba(43,30,20,.16); border-radius:var(--radius-m);
    padding:11px 12px; background:#fff; color:var(--ink); font-size:14.5px;
  }
  .field input:focus, .field textarea:focus, .field select:focus{border-color:var(--coffee-700);}
  .field textarea{resize:vertical; min-height:76px; line-height:1.5;}
  .field-hint{font-size:11.5px; color:var(--stone); margin-top:5px;}
 
  .photo-picker{display:flex; flex-direction:column; gap:10px; margin-bottom:10px;}
  .photo-preview{
    position:relative; aspect-ratio:3/4; max-width:180px; border-radius:var(--radius-m);
    overflow:hidden; background:var(--latte-100);
  }
  .photo-preview img, .photo-preview svg{width:100%; height:100%; object-fit:cover;}
  .photo-loading{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-size:12.5px; color:var(--coffee-700); text-align:center; padding:10px;
    background:linear-gradient(90deg,#E6DAC4 25%,#F1E7D5 37%,#E6DAC4 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite;
  }
  .photo-remove{
    position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%;
    background:rgba(43,30,20,.78); color:#fff; border:none; display:flex; align-items:center; justify-content:center;
  }
  .photo-remove svg{width:14px; height:14px;}
  .photo-upload-btn{display:inline-flex; width:auto; cursor:pointer;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-top:1px solid rgba(43,30,20,.08);}
  .toggle-row:last-child{border-bottom:1px solid rgba(43,30,20,.08);}
  .toggle-row .t-label{font-size:14px; font-weight:500; color:var(--ink);}
  .toggle-row .t-sub{font-size:12px; color:var(--stone); margin-top:2px;}
  .switch{position:relative; width:42px; height:24px; flex:none;}
  .switch input{opacity:0; width:0; height:0; position:absolute;}
  .switch .track{position:absolute; inset:0; background:var(--stone-light); border-radius:99px; transition:.15s;}
  .switch .track::after{content:''; position:absolute; width:18px; height:18px; border-radius:50%; background:#fff; top:3px; left:3px; transition:.15s var(--ease); box-shadow:0 1px 3px rgba(0,0,0,.2);}
  .switch input:checked + .track{background:var(--coffee-700);}
  .switch input:checked + .track::after{transform:translateX(18px);}
  .error-text{font-size:13px; color:var(--danger); background:rgba(163,64,46,.08); border-radius:var(--radius-m); padding:9px 12px; margin-bottom:16px;}
 
  /* ---------- admin dashboard ---------- */
  .admin-toolbar{padding:16px 20px 6px; display:flex; gap:10px; align-items:center;}
  .admin-toolbar .search-box{flex:1; margin-bottom:0;}
  .admin-list{padding:14px 20px 100px; display:flex; flex-direction:column; gap:10px; max-width:760px; margin:0 auto; width:100%;}
  .admin-row{
    display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid rgba(43,30,20,.08);
    border-radius:var(--radius-m); padding:10px;
  }
  .admin-thumb{width:52px; height:64px; border-radius:4px; overflow:hidden; background:var(--latte-100); flex:none;}
  .admin-thumb img{width:100%; height:100%; object-fit:cover;}
  .admin-row-info{flex:1; min-width:0;}
  .admin-row-info .an{font-family:'Fraunces',serif; font-size:14.5px; font-weight:520; color:var(--coffee-900); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .admin-row-info .ar{font-size:12px; color:var(--stone);}
  .admin-row-actions{display:flex; gap:2px; flex:none;}
  .admin-fab{position:fixed; right:18px; bottom:18px; z-index:36;}
  .admin-fab .btn{border-radius:999px; padding:15px 22px; box-shadow:var(--shadow-2); width:auto;}
 
  /* ---------- cart ---------- */
  .cart-row{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid rgba(43,30,20,.08);}
  .cart-row:first-child{padding-top:2px;}
  .cart-row:last-child{border-bottom:none;}
  .cart-thumb{width:56px; height:70px; border-radius:var(--radius-s); overflow:hidden; background:var(--latte-100); flex:none;}

  function cartTotal(){
    var hasAllPrices = state.cart.every(function(it){ return it.preco !== null && it.preco !== undefined; });
    if(!hasAllPrices) return null;
    return state.cart.reduce(function(sum,it){ return sum + (it.preco * it.qty); }, 0);
  }
  function buildOrderMessage(){
    var lines = ["Olá! Gostaria de fazer o seguinte pedido na Propósito Jeans:", ""];

    lines.push("");

      foto:p.foto||"", tamanhos:p.tamanhos.slice(), preco: p.preco===null||p.preco===undefined ? "" : p.preco,
      modelagem:p.modelagem, corLavagem:p.corLavagem, novidade:!!p.novidade, maisVendido:!!p.maisVendido
    };
    state.editingId = id; state.formError="";
    state.view = "admin-form"; render(); window.scrollTo(0,0);
  };

    state.formState = null; state.editingId = null; state.view = "admin-dashboard"; render();

  window.handleFileUpload = function(input){
    var file = input.files && input.files[0];
    if(!file) return;
    if(file.type.indexOf('image/') !== 0){ showToast("Escolha um arquivo de imagem."); input.value=""; return; }
    state.formPhotoLoading = true; render();
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxW = 800;
        var scale = Math.min(1, maxW / img.width);
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        state.formState.foto = dataUrl;
        state.formPhotoLoading = false;
        input.value = "";
        render();
      };
      img.onerror = function(){
        state.formPhotoLoading = false;
        showToast("Não foi possível ler essa imagem.");
        render();
      };
      img.src = e.target.result;
    };
    reader.onerror = function(){
      state.formPhotoLoading = false;
      showToast("Não foi possível ler esse arquivo.");
      render();
    };
    reader.readAsDataURL(file);
  };
  window.toggleFormSize = function(sz){
    var arr = state.formState.tamanhos;
    var idx = arr.indexOf(sz);
    if(idx>-1) arr.splice(idx,1); else arr.push(sz);
    render();
  };

  window.saveProduct = function(){
    var f = state.formState;
    f.nome = document.getElementById('f-nome').value.trim();
    f.referencia = document.getElementById('f-ref').value.trim();
    f.descricao = document.getElementById('f-descricao').value.trim();
    f.preco = document.getElementById('f-preco').value.trim();
    f.modelagem = document.getElementById('f-modelagem').value;
    f.corLavagem = document.getElementById('f-cor').value;
 
    if(!f.nome){ state.formError = "Informe o nome do produto."; render(); return; }
    if(!f.referencia){ state.formError = "Informe a referência/código."; render(); return; }
    if(!f.tamanhos.length){ state.formError = "Selecione ao menos um tamanho disponível."; render(); return; }
 
    var precoNum = f.preco === "" ? null : Number(f.preco.replace(",", "."));
    if(f.preco !== "" && isNaN(precoNum)){ state.formError = "Preço inválido."; render(); return; }
 
    if(state.editingId){
      var idx = state.products.findIndex(function(x){return x.id===state.editingId;});
      if(idx>-1){
        var prev = state.products[idx];
        state.products[idx] = Object.assign({}, prev, {
          nome:f.nome, referencia:f.referencia, descricao:f.descricao,
          foto:f.foto, tamanhos:f.tamanhos.slice(), preco:precoNum, modelagem:f.modelagem, corLavagem:f.corLavagem,
          novidade:!!f.novidade, maisVendido:!!f.maisVendido
        });
      }
    } else {
      state.products.unshift({
        id:uid(), nome:f.nome, referencia:f.referencia, descricao:f.descricao,
        foto:f.foto, tamanhos:f.tamanhos.slice(), preco:precoNum, modelagem:f.modelagem, corLavagem:f.corLavagem,
        novidade:!!f.novidade, maisVendido:!!f.maisVendido, dataCadastro:new Date().toISOString()
      });
    }
    var wasEditing = !!state.editingId;
    saveProducts(state.products).then(function(){
      showToast(wasEditing ? "Produto atualizado com sucesso." : "Produto adicionado ao catálogo.");
    });
    state.formState = null; state.editingId = null; state.formError="";
    state.view = "admin-dashboard"; render();
  };

  /* ============ FILTER LOGIC ============ */
  function getFilteredProducts(){
    var list = state.products.slice();
    if(state.activeCategory==='novidades') list = list.filter(function(p){return p.novidade || timeAgoIsNew(p.dataCadastro);});
    else if(state.activeCategory==='maisvendidos') list = list.filter(function(p){return p.maisVendido;});
 
    var q = normalize(state.searchQuery.trim());
    if(q) list = list.filter(function(p){ return normalize(p.nome).indexOf(q)>-1 || normalize(p.referencia).indexOf(q)>-1; });
 
    var f = state.filters;
    if(f.tamanho.length) list = list.filter(function(p){ return p.tamanhos.some(function(t){return f.tamanho.indexOf(t)>-1;}); });
    if(f.modelagem.length) list = list.filter(function(p){ return f.modelagem.indexOf(p.modelagem)>-1; });
    if(f.corLavagem.length) list = list.filter(function(p){ return f.corLavagem.indexOf(p.corLavagem)>-1; });
    return list;
  }

          '<div class="field-hint">Escolha uma foto da galeria do celular. Sem foto? A peça aparece com uma ilustração no lugar dela.</div>'+
        '</div>'+
 
        '<div class="field"><label for="f-nome">Nome do produto</label><input id="f-nome" type="text" placeholder="Ex: Calça Jeans Skinny Cintura Alta" value="'+escapeAttr(f.nome)+'" oninput="setFormField(\'nome\', this.value)"></div>'+
        '<div class="field"><label for="f-ref">Referência / código</label><input id="f-ref" type="text" placeholder="Ex: PJ-009" value="'+escapeAttr(f.referencia)+'" oninput="setFormField(\'referencia\', this.value)"></div>'+
        '<div class="field"><label for="f-descricao">Descrição</label><textarea id="f-descricao" placeholder="Conte sobre o tecido, o caimento, a lavagem e outros detalhes da peça." oninput="setFormField(\'descricao\', this.value)">'+escapeAttr(f.descricao)+'</textarea></div>'+
 
        '<div class="row2">'+
          '<div class="field"><label for="f-preco">Preço (opcional)</label><input id="f-preco" type="text" inputmode="decimal" placeholder="Ex: 189,90" value="'+escapeAttr(f.preco)+'" oninput="setFormField(\'preco\', this.value)"></div>'+
          '<div class="field"><label for="f-modelagem">Modelagem</label><select id="f-modelagem" onchange="setFormField(\'modelagem\', this.value)">'+selectOptions(MODELAGENS, f.modelagem)+'</select></div>'+
        '</div>'+
        '<div class="field"><label for="f-cor">Cor / lavagem</label><select id="f-cor" onchange="setFormField(\'corLavagem\', this.value); render()">'+selectOptions(CORES, f.corLavagem)+'</select></div>'+
 
        '<div class="field"><label>Tamanhos disponíveis</label>'+
          '<div class="filter-options">'+TAMANHOS_PADRAO.map(function(t){
            var on = f.tamanhos.indexOf(t)>-1;
            return '<button type="button" class="opt-chip'+(on?' on':'')+'" onclick="toggleFormSize(\''+t+'\')">'+t+'</button>';
          }).join('')+'</div>'+
        '</div>'+
 
        '<div class="toggle-row"><div><div class="t-label">Marcar como novidade</div><div class="t-sub">Aparece na categoria "Novidades"</div></div>'+
          '<label class="switch"><input type="checkbox" '+(f.novidade?'checked':'')+' onchange="toggleFormBool(\'novidade\')"><span class="track"></span></label></div>'+
        '<div class="toggle-row"><div><div class="t-label">Marcar como mais vendido</div><div class="t-sub">Aparece na categoria "Mais vendidos"</div></div>'+
          '<label class="switch"><input type="checkbox" '+(f.maisVendido?'checked':'')+' onchange="toggleFormBool(\'maisVendido\')"><span class="track"></span></label></div>'+
 
        '<div style="display:flex;gap:10px;margin-top:24px;">'+
          '<button class="btn btn-ghost" onclick="closeForm()">Cancelar</button>'+
          '<button class="btn btn-primary" onclick="saveProduct()">Salvar produto</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }
 
  /* ---------- delete confirm ---------- */
  function renderDeleteConfirm(){
    var open = !!state.deleteConfirmId;
    var p = open ? state.products.find(function(x){return x.id===state.deleteConfirmId;}) : null;
    return '<div class="modal-center'+(open?' open':'')+'" onclick="if(event.target===this) cancelDelete()">'+
      '<div class="modal-card">'+
        '<h3>Excluir produto?</h3>'+
        '<p class="sub">'+(p ? 'Isso vai remover "'+escapeAttr(p.nome)+'" do catálogo permanentemente.' : '')+'</p>'+
        '<div style="display:flex;gap:10px;">'+
          '<button class="btn btn-ghost" onclick="cancelDelete()">Cancelar</button>'+
          '<button class="btn btn-danger" onclick="confirmDelete()">Excluir</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }
 
  function renderToast(){
    if(!state.toast) return '<div class="toast-wrap"></div>';
    return '<div class="toast-wrap"><div class="toast show">'+ICON.check+state.toast+'</div></div>';
  }
 
  /* ============ MAIN RENDER ============ */
  function buildHTML(){
    var body = "";
    switch(state.view){
      case "detail": body = renderDetail(); break;
      case "admin-login": body = renderAdminLogin(); break;
      case "admin-dashboard": body = state.isAdmin ? renderAdminDashboard() : renderAdminLogin(); break;
      case "admin-form": body = state.isAdmin ? renderAdminForm() : renderAdminLogin(); break;
      default: body = renderCatalog();
    }
    return body + renderFilterSheet() + renderCartSheet() + renderDeleteConfirm() + renderToast();
  }
 
  var root = document.getElementById('root');
  function render(){
    var active = document.activeElement;
    var activeId = active && active.id;
    var selStart, selEnd;
    try{ selStart = active.selectionStart; selEnd = active.selectionEnd; }catch(e){}
    root.innerHTML = buildHTML();
    if(activeId){
      var el = document.getElementById(activeId);
      if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')){
        el.focus();
        try{ if(selStart!=null) el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
 
  /* ============ INIT ============ */
  render();
  loadProducts();
  loadCart();
 
})();
</script>
</body>
</html>
